[package]
name = "wgpu-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
winit = "0.30"
wgpu = "26.0.0"

#------------------
cfg-if = "1.0"
pollster = "0.4.0"  # 用于阻塞运行异步代码
# 第四章依赖
bytemuck = { version = "1.22", features = [ "extern_crate_alloc", "min_const_generics" ] }
# 第六章依赖
glam = "0.29"
# 第五章依赖
anyhow = "1.0"
fs_extra = "1.3"    #new -第九章依赖
tobj = { version = "3.2", features = [
    "async",
]}
[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]
# 第九章依赖
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Other dependencies
reqwest = { version = "0.11" }
web-sys = { version = "0.3.77", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}


[profile.dev]
opt-level = 1  # 开发模式基础优化

[profile.release]
opt-level = 3        # 最高级别优化

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.3"
